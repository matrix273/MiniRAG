version: 1
disable_existing_loggers: false

formatters:
  default:
    class: uvicorn.logging.ColourizedFormatter
    format: "%(asctime)s - %(levelprefix)s%(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    use_colors: true
  access:
    class: uvicorn.logging.AccessFormatter
    format: "%(asctime)s - %(client_addr)s - %(request_line)s %(status_code)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    use_colors: true

handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stdout
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout

loggers:
  uvicorn:
    handlers: [default]
    level: INFO
    propagate: false
  uvicorn.error:
    handlers: [default]
    level: INFO
    propagate: false
  uvicorn.access:
    handlers: [access]
    level: INFO
    propagate: false

root:
  handlers: [default]
  level: INFO
